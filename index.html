<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir Studio - AI Cinematic Generator</title>

  <!-- 💬 카카오톡 & SNS 공유 미리보기 (오픈그래프 태그) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Noir Studio">
  <meta property="og:title" content="Noir Studio - AI Cinematic Generator">
  <meta property="og:description" content="AI 기반 시네마틱 느와르 아트 및 영상 제작 스튜디오">
  <meta property="og:image" content="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80">
  <meta property="og:url" content="https://noir-studio-sepia.vercel.app">

  <!-- 트위터 카드 설정 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Noir Studio - AI Cinematic Generator">
  <meta name="twitter:description" content="AI 기반 시네마틱 느와르 아트 및 영상 제작 스튜디오">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0b0e;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      border-bottom: 1px solid #1f1f2e;
      background: rgba(11, 11, 14, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
    }
    .pro-btn {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .pro-btn:hover {
      opacity: 0.9;
    }
    .main-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 0.9rem;
      color: #9ca3af;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #2d2d3d;
      background: #15151c;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #6366f1;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #1f1f2e;
      color: #d1d5db;
    }
    .btn-secondary:hover {
      background: #2d2d3d;
    }
    .result-area {
      width: 100%;
      min-height: 300px;
      border: 2px dashed #2d2d3d;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121218;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NOIR STUDIO</div>
    <button class="pro-btn" onclick="simulateUpgrade()">✨ PRO UPGRADE</button>
  </header>

  <div class="main-container">
    <div class="input-group">
      <label for="prompt">Cinematic Prompt</label>
      <textarea id="prompt" placeholder="어떤 시네마틱 장면을 만들고 싶으신가요? (예: A detective in a rainy neo-noir city...)"></textarea>
      
      <div class="btn-row">
        <button class="action-btn btn-secondary" onclick="applyRandomPrompt()">🎲 무작위 추천</button>
        <button class="action-btn btn-secondary" onclick="clearHistory()">🗑️ 초기화</button>
      </div>
    </div>

    <button class="action-btn btn-primary" style="padding: 16px;" onclick="generateDemoImage()">✨ 이미지 생성하기</button>

    <div class="input-group">
      <label>Result</label>
      <div id="result" class="result-area">
        <span style="color: #6b7280; font-size: 0.9rem;">생성된 이미지가 이곳에 표시됩니다.</span>
      </div>
    </div>
  </div>

  <script>
    // 1. 상태 및 관리자 키 설정
    let isPro = false;
    const ADMIN_SECRET_KEY = "noir2026";

    // 2. PRO 업그레이드 (관리자 우회 및 워터마크 해제 제어)
    function simulateUpgrade() {
      const inputKey = prompt(
        "PRO 플랜은 현재 정식 오픈 준비 중입니다!\n\n" +
        "※ 관리자이신 경우 전용 우회 키를 입력해 주세요."
      );
      if (inputKey === null) return;

      if (inputKey.trim() === ADMIN_SECRET_KEY) {
        isPro = true;
        alert("⚡ [관리자 인증 성공] Pro 모드가 활성화되었습니다. (워터마크 해제)");
        
        const proBtn = document.querySelector(".pro-btn");
        if (proBtn) proBtn.innerText = "👑 PRO ACTIVE";
      } else {
        alert("📢 PRO 플랜 정식 결제 시스템은 곧 오픈될 예정입니다. 조금만 기다려 주세요!");
      }
    }

    // 3. 이미지 생성 함수 (시네마틱 결과 출력 및 워터마크 분기)
    function generateDemoImage() {
      const promptInput = document.getElementById("prompt");
      const promptText = promptInput && promptInput.value.trim() !== "" ? promptInput.value : "Cinematic noir scene, 8k";
      
      let resultContainer = document.getElementById("result");
      if (!resultContainer) return;

      // 로딩 상태 표시
      resultContainer.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px; color:#fff;">
          <div style="font-size:1.05rem; margin-bottom:8px;">✨ 느와르 시네마틱 AI가 생성 중입니다...</div>
          <div style="font-size:0.8rem; color:#888; max-width: 400px; text-align: center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">"${promptText}"</div>
        </div>
      `;

      // 1.5초 후 결과 렌더링
      setTimeout(() => {
        const imageUrl = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80";
        
        resultContainer.innerHTML = `
          <div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
            <img src="${imageUrl}" style="width:100%; height:100%; object-fit:cover; display:block;" alt="Noir Art" />
            
            ${!isPro ? `
              <!-- 무료 버전 중앙 대각선 반투명 워터마크 -->
              <div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none;">
                <div style="transform: rotate(-30deg); border: 2px dashed rgba(255,255,255,0.4); padding: 12px 24px; background: rgba(0,0,0,0.3);">
                  <span style="font-size: clamp(16px, 4vw, 24px); font-weight: bold; color: rgba(255,255,255,0.5); letter-spacing: 2px; text-shadow: 1px 1px 3px rgba(0,0,0,0.9);">NOIR STUDIO - FREE</span>
                </div>
              </div>
            ` : `
              <!-- Pro 버전 인증 뱃지 -->
              <div style="position:absolute; top:12px; right:12px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.4);">
                PRO (Watermark Free)
              </div>
            `}
          </div>
        `;
      }, 1500);
    }

    // 4. 무작위 프롬프트 추천 기능
    function applyRandomPrompt() {
      const prompts = [
        "A detective standing in a rainy neo-noir city at night, glowing neon signs, dramatic rim lighting, cinematic 8k",
        "Cyberpunk hacker in a dark room illuminated by neon blue screens, atmospheric smoke, hyper-detailed",
        "A mysterious noir character in a tailored black suit under a street lamp, foggy alleyway, high contrast masterpiece"
      ];
      const random = prompts[Math.floor(Math.random() * prompts.length)];
      const inputEl = document.getElementById("prompt");
      if (inputEl) {
        inputEl.value = random;
      }
    }

    // 5. 초기화 및 모달 유틸리티 함수들
    function clearHistory() {
      const inputEl = document.getElementById("prompt");
      if (inputEl) inputEl.value = "";
      
      const resultContainer = document.getElementById("result");
      if (resultContainer) {
        resultContainer.innerHTML = `<span style="color: #6b7280; font-size: 0.9rem;">생성된 이미지가 이곳에 표시됩니다.</span>`;
      }
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) modal.style.display = 'flex';
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) modal.style.display = 'none';
    }
  </script>
</body>
</html>
